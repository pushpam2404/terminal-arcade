# Merge a pull request by itself once every required check is green.
#
# This repository has no maintainers watching it day to day, and exists so that
# people can learn by contributing. Waiting days for a human to press a button
# is the main reason first contributions go cold, so the CI checks are the gate
# instead.
#
# What stops this being reckless:
#
#   - It only enables GitHub's own auto-merge. GitHub still refuses to merge
#     until every required status check passes, so a red check means nothing
#     happens.
#   - It refuses outright on any pull request that touches .github/ — otherwise
#     somebody could rewrite the checks in their own pull request and then be
#     merged by the checks they just rewrote.
#   - It refuses on anything unusually large, which is the shape spam and
#     accidental "committed my whole node_modules" pull requests take.
#   - Draft pull requests are ignored.
#
# Anything it refuses is simply left open with a comment, for a human to look
# at. Nothing is ever closed automatically.
name: Auto-merge

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  enable:
    name: enable auto-merge
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - name: Decide whether this one may merge itself
        id: check
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const { owner, repo } = context.repo;

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner, repo, pull_number: pr.number, per_page: 100,
            });

            const touchesCi = files.some((f) => f.filename.startsWith('.github/'));
            const tooBig = files.length > 20 || (pr.additions + pr.deletions) > 600;

            let reason = '';
            if (touchesCi) {
              reason = 'it changes files under `.github/` — workflows, templates or ' +
                       'labels. Those decide what the checks even are, so a person ' +
                       'reads these rather than the checks approving themselves.';
            } else if (tooBig) {
              reason = `it is large (${files.length} files, ` +
                       `+${pr.additions}/-${pr.deletions} lines). Big changes get ` +
                       'read by a person.';
            }

            core.setOutput('allowed', reason ? 'false' : 'true');
            core.setOutput('reason', reason);

      - name: Enable auto-merge
        if: steps.check.outputs.allowed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" \
            --squash --auto --delete-branch
          echo "Auto-merge enabled. GitHub will merge this once every required check is green."

      - name: Explain why a human is needed instead
        if: steps.check.outputs.allowed != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const number = context.payload.pull_request.number;
            const reason = ${{ toJSON(steps.check.outputs.reason) }};

            const marker = '<!-- auto-merge-held -->';
            const existing = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: number, per_page: 100,
            });
            if (existing.some((c) => c.body.includes(marker))) return;

            await github.rest.issues.createComment({
              owner, repo, issue_number: number,
              body:
                `${marker}\n` +
                `**This one will not merge itself.**\n\n` +
                `Most pull requests here merge automatically as soon as the checks ` +
                `go green. This one is held back because ${reason}\n\n` +
                `That is not a rejection and you have not done anything wrong — it ` +
                `just needs a human to read it, which may take a little longer. ` +
                `Thanks for contributing.`,
            });
